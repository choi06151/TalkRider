<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAR PLAYGROUND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* CAR PLAYGROUND v1.1 — Figma CARPLAYGROUND › 디자인 시스템 › 07 · Screens 를 그대로 옮긴 화면.
   레이아웃·색·효과는 <template> 안의 인라인 스타일(피그마 값 그대로)이고, 아래는 상호작용 상태와
   피그마 화면에 없던 입력 요소(버튼·입력창)만 디자인 시스템 토큰으로 정의한다. */
:root {
  --text-primary: #F7F9FF; --text-secondary: #CED5E4; --text-tertiary: #9EA6BD; --text-accent: #E155BA;
  --surface-raised: #262933; --surface-selected: #34294D;
  --g-glass: linear-gradient(113.2deg, #272A34 0%, #171920 52%, #1B1D26 100%);
  --g-cta: linear-gradient(113.2deg, #CC3A85 0%, #E054B9 49%, #EB7ACA 100%);
  --g-accent: linear-gradient(127deg, #FF8DE1 0%, #F13AC0 100%);
  --g-violet: linear-gradient(127deg, #35304D 0%, #35294E 50%, #702BA4 100%);
  --fx-glass: inset 0 0 21.24px 0.97px rgba(112,119,122,.64);
  --fx-glass-s: inset 0 0 9.66px 0.97px rgba(112,119,122,.64);
  --fx-accent: inset 0 0 14px 0 rgba(255,173,242,.5), 0 6px 28px 0 rgba(224,84,186,.35);
  --f: 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --coral: #F16BA6; --sun: #F5C76B; --sea: #5FA8FF; --mint: #4FD8C4; --grape: #A58BFF; --card: #171920;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: #040507; color: var(--text-primary); font-family: var(--f); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
#chrome { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#chrome > * { pointer-events: auto; }
.screen { position: absolute; inset: 0; display: none; animation: in .25s ease; }
.screen.active { display: block; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.f-t .f-tx { overflow-wrap: anywhere; }
[role="button"] { cursor: pointer; user-select: none; -webkit-user-select: none; }
[role="button"]:focus-visible, .ds-btn:focus-visible, .ds-chip:focus-visible, .ds-field:focus-visible { outline: 3px solid #FF8DE1; outline-offset: 3px; }
[role="button"]:hover { filter: brightness(1.08); }

/* ---- Side Menu · Nav Item (State=Default / Active) ---- */
.nav-item { background: none !important; box-shadow: none !important; }
.nav-item .f-t { color: #FFFFFF !important; }
.nav-item svg [stroke] { stroke: #F7F9FF; }
.nav-item.active { background: #34294D !important; box-shadow: var(--fx-glass) !important; }
.nav-item.active .f-t { color: #E155BA !important; }
.nav-item.active svg [stroke] { stroke: #E155BA; }

/* ---- Status Pill ---- */
.status-pill { width: auto !important; padding: 0 24px; display: flex; align-items: center; gap: 8px; }
.status-pill > .f-t { position: static !important; width: auto !important; height: auto !important; }
.status-pill .st-dot { width: 12px; height: 12px; border-radius: 50%; background: #E054BA; flex: none; display: none; }
.status-pill.is-drive .st-dot { display: block; }
.status-pill .f-f[data-name="dot"] { display: none; }

/* ---- Voice Bar ---- */
#mic .wv { transform-origin: center; }
#mic.on .wv { animation: wv 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * -85ms); }
#mic:not(.on) .wv { opacity: .55; }
@keyframes wv { 50% { transform: scaleY(.4); } }
#mic-text { white-space: nowrap; text-overflow: ellipsis; }

/* ---- Chip / Relation (State=Default ↔ Selected) ---- */
.chip[aria-pressed="false"] { background: var(--g-glass) !important; box-shadow: var(--fx-glass-s) !important; }
.chip[aria-pressed="false"] .f-t, .chip[aria-pressed="false"].ds-chip { color: var(--text-secondary) !important; }
.chip[aria-pressed="true"] { background: var(--g-cta) !important; box-shadow: none !important; }
.chip[aria-pressed="true"] .f-t, .chip[aria-pressed="true"].ds-chip { color: #FFFFFF !important; }
/* Toggle / Display Mode · Button/Mic Test */
.tog[aria-pressed="true"] { background: var(--g-cta) !important; box-shadow: none !important; }
.tog[aria-pressed="true"] .f-t { color: #FFFFFF !important; }
.tog[aria-pressed="false"] { background: var(--g-glass) !important; box-shadow: var(--fx-glass-s) !important; }
.tog[aria-pressed="false"] .f-t { color: var(--text-secondary) !important; }
/* Seat */
.seat.is-empty { opacity: .55; }

/* ---- 놀이 카드 캐러셀 (Card/Game Recommend) ---- */
.carousel { display: flex; gap: 22px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; cursor: grab; touch-action: pan-x; }
.carousel::-webkit-scrollbar { display: none; }
.carousel.drag { cursor: grabbing; scroll-snap-type: none; }
.carousel .tcard { scroll-snap-align: start; }
.tcard.is-disabled { opacity: .45; cursor: not-allowed; }
.tcard:hover { box-shadow: var(--fx-accent), inset 0 0 0 2px rgba(224,84,185,.6) !important; }
.tabs { display: flex; gap: 8px; }

/* ---- 대화: 선택지 (Game/AB Option Card) ---- */
#q-body .opts { position: relative; width: 100%; height: 250px; }
#q-body .opt.picked { background: #34294D !important; box-shadow: var(--fx-accent), inset 0 0 0 2px rgba(224,84,185,.85) !important; }
#q-body .opt.right { background: var(--g-cta) !important; box-shadow: var(--fx-accent) !important; }
#q-body .opt.wrong { opacity: .45; }
#q-body .opt[disabled] { cursor: default; }
#q-body.panel-mode { display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 32px; border-radius: 28px; background: var(--g-glass); box-shadow: var(--fx-glass); }
#q-body .sub { margin: 0; font: 400 28px/40px var(--f); color: var(--text-secondary); }
#q-body .words { font: 700 40px/52px var(--f); text-align: center; padding: 24px; border-radius: 20px; background: var(--g-violet); box-shadow: inset 0 0 16.6px .98px rgba(180,150,216,.48); }
#q-body .say { display: inline-block; margin: 0; padding: 16px 24px; border-radius: 20px; background: var(--surface-raised); font: 400 28px/40px var(--f); }
#q-body #rank-line { position: absolute; left: 0; top: 262px; }
#hint-box { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.qtype { display: flex; gap: 8px; }
.result { padding: 12px 24px; border-radius: 999px; font: 700 24px/32px var(--f); display: inline-block; }
.result.good { background: var(--g-cta); color: #fff; }
.result.soft { background: var(--g-violet); box-shadow: inset 0 0 16.6px .98px rgba(180,150,216,.48); }
.result.info { background: var(--surface-raised); box-shadow: var(--fx-glass-s); }
.nudge { font: 400 24px/34px var(--f); border-left: 4px solid var(--text-accent); padding: 4px 16px; }
.inputrow, .controls, .head-actions, .rate { display: flex; gap: 12px; align-items: center; }
.drivehint { font: 700 24px/32px var(--f); text-align: center; color: var(--text-secondary); }
body.drive .parked-only { display: none !important; }
body.drive .needs-parked { pointer-events: none; opacity: .4; }
body:not(.drive) .drive-only { display: none !important; }
body.drive #q-text { font-size: 56px !important; line-height: 68px !important; }
body.drive #q-body .opt { pointer-events: none; }

/* ---- 목록 (List/Game Row · List/Question Row L) ---- */
.flist { overflow-y: auto; scrollbar-width: none; }
.flist::-webkit-scrollbar { display: none; }
.flist .sub, #wrap-list .sub { margin: 0; font: 400 24px/34px var(--f); color: var(--text-secondary); }

/* ---- Button / Chip / Field · 디자인 시스템 컴포넌트 (피그마 화면에 없던 입력 요소) ---- */
.ds-btn { display: inline-flex; align-items: center; justify-content: center; height: 56px; padding: 0 32px; border: 0; border-radius: 999px; font: 700 20px/28px var(--f); white-space: nowrap; cursor: pointer; transition: transform .08s, filter .15s; }
.ds-btn.lg { height: 72px; padding: 0 40px; font: 700 24px/32px var(--f); }
.ds-btn.primary { background: var(--g-cta); color: #fff; }
.ds-btn.secondary { background: var(--g-glass); box-shadow: var(--fx-glass-s); color: var(--text-secondary); }
.ds-btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(102,115,133,.48); color: var(--text-secondary); }
.ds-btn:hover { filter: brightness(1.12); } .ds-btn:active { transform: scale(.97); }
.ds-chip { height: 48px; padding: 0 24px; border: 0; border-radius: 999px; font: 700 20px/28px var(--f); cursor: pointer; }
.ds-pill { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px; background: var(--g-glass); box-shadow: var(--fx-glass-s); font: 700 20px/28px var(--f); color: var(--text-secondary); border: 0 !important; }
.ds-field { flex: 1; height: 56px; padding: 0 24px; border: 0; border-radius: 20px; background: var(--g-glass); box-shadow: var(--fx-glass-s); color: var(--text-primary); font: 400 24px/34px var(--f); }
.ds-field::placeholder { color: var(--text-tertiary); }

#toast { position: absolute; left: 50%; top: 840px; transform: translate(-50%, 20px); background: #34294D; box-shadow: var(--fx-accent); color: var(--text-primary); padding: 16px 32px; border-radius: 999px; font: 700 24px/32px var(--f); opacity: 0; pointer-events: none; transition: .25s; z-index: 60; max-width: 1200px; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>

}
function showHint() {
  var q = S.q; if (!q || !q.hints || S.answered) return;
  if (S.hintN >= q.hints.length) { toast('더 드릴 힌트가 없어요'); return; }
  var hs = q.hints[S.hintN++]; var box = $('#hint-box');
  if (box) box.appendChild(h('span', 'say', '힌트 ' + S.hintN + ': ' + hs)); else showResult('info', '힌트: ' + hs);
  Voice.speak('힌트. ' + hs);
}
function revealAnswer() {
  var q = S.q; if (!q) return; var msg = '';
  if (q.type === 'RECALL') { var w = $('#words'); if (w) w.textContent = q.items.join('  ·  '); S.hidden = false; showResult('info', '읽어 드린 순서: ' + q.items.join(', ')); Voice.speak(q.items.join(', ')); return; }
  if (q.answers) msg = '정답은 ' + q.answers[0] + '예요. ' + (q.reveal || ''); else if (q.num) msg = '정답은 ' + fmt(q.num.value) + q.num.unit + '예요.'; else if (q.answer) msg = '정답은 ' + choiceLabel(q, q.answer) + '예요. ' + (q.reveal || '');
  if (!msg) return;
  if (q.answer) lockOpts(null, q.answer);
  showResult('info', msg);
  if (!S.answered) finish(q.answers ? q.answers[0] : q.num ? fmt(q.num.value) + q.num.unit : choiceLabel(q, q.answer), msg); else Voice.speak(msg);
}
function onNextButton() {
  var q = S.q, t = q && typeOf(q.type);
  if (q && (t.kind === 'open' || t.kind === 'speak') && !S.answered) {
    var a = S.ans || '함께 이야기했어요'; showResult('info', '좋아요, 이야기가 잘 모였어요.'); finish(a, '좋아요.'); return;
  }
  nextStep();
}
$('#c-next').addEventListener('click', onNextButton);
$('#c-repeat').addEventListener('click', function () { if (S && S.q) renderCurrent(true); });
$('#c-hint').addEventListener('click', showHint);
$('#c-reveal').addEventListener('click', revealAnswer);
$('#t-end').addEventListener('click', endSession);
function sendTyped() { var i = $('#t-input'), v = i.value.trim(); if (!v) return; i.value = ''; handleUtter(v, true); }
$('#t-send').addEventListener('click', sendTyped);
$('#t-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendTyped(); });

/* ---------- wrap · Figma "오늘의 놀이 기록" ---------- */
function hhmm(t) { var d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function endSession() {
  Voice.cancel(); Mic.stop();
  if (!S) { show('home'); return; }
  if (S.q && !S.answered) S.skips++;
  var minutes = Math.max(1, Math.round((Date.now() - S.t0) / 60000));
  var list = $('#wrap-list'); list.innerHTML = '';
  S.done.forEach(function (e, i) {
    var r = FUI.clone('qRow'); FUI.place(r, 0, i * 101, 1040, 82);
    var qt = FUI.n(r, '다음 여행은 바다 vs 산?'), at = FUI.n(r, '바다 2명 · 산 1명');
    FUI.setT(qt, (e.q.length > 30 ? e.q.slice(0, 29) + '…' : e.q)); FUI.setT(at, e.a);
    at.style.left = 'auto'; at.style.right = '24px'; at.style.width = 'auto'; at.style.maxWidth = '420px'; at.style.overflow = 'hidden'; at.style.textOverflow = 'ellipsis';
    list.appendChild(r);
  });
  if (!S.done.length) list.appendChild(h('p', 'sub', '이번에는 기록된 이야기가 없어요.'));
  var label = S.type && S.type !== 'ANY' ? typeOf(S.type).name : '자유 · 아무거나';
  FUI.setT($('#wrap-title'), label);
  FUI.setT($('#wrap-time'), '오늘 ' + hhmm(S.t0) + ' · ' + minutes + '분');
  FUI.setT($('#wrap-people'), (REL_LABEL[store.data.rel] || '') + ' ' + store.data.people + '명');
  FUI.setT($('#wrap-count'), S.done.length + '개');
  FUI.setT($('#wrap-sub'), '오늘의 기록  /  ' + label + '  ·  건너뜀 ' + S.skips + '개 (점수는 매기지 않아요)');
  var entry = { t: Date.now(), mode: S.mode, type: S.type || null, rel: store.data.rel, people: store.data.people, dest: store.data.dest || null, remain: store.data.remain, answered: S.done.length, skipped: S.skips, minutes: minutes, types: S.types, rating: null };
  store.data.log.push(entry); store.data.log = store.data.log.slice(-60); store.save(); wrapEntry = entry;
  $$('#rate .chip').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
  S = null; show('wrap');
}
var wrapEntry = null;
$$('#rate .chip').forEach(function (b) { b.addEventListener('click', function () { if (!wrapEntry) return; wrapEntry.rating = +b.getAttribute('data-v'); store.save(); $$('#rate .chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); SFX.ok(); toast('의견 고마워요'); }); });
$('#wrap-new').addEventListener('click', function () { openFree(); });

/* ---------- vehicle state (Top Bar · Status Pill) ---------- */
function renderPill() {
  FUI.setT($('#st-label'), drive ? '주행 중 · 음성 진행' : 'P 정차 중');
  var dot = $('#st-dot'); if (dot) dot.style.display = drive ? '' : 'none';
  $('#st-pill').classList.toggle('is-drive', drive);
}
function setDrive(on) {
  drive = on; document.body.classList.toggle('drive', on);
  $('#st-park').setAttribute('aria-pressed', String(!on)); $('#st-drive').setAttribute('aria-pressed', String(on));
  renderPill();
  if (on) { Mic.start(route); if (screenName === 'talk' && S && S.q) renderCurrent(false); } else { if (screenName !== 'talk') Mic.stop(); setMic(Mic.active ? 'on' : 'idle'); }
  toast(on ? '주행 중: 음성으로만 조작해요' : '정차 중: 화면 조작이 가능해요');
}
$('#st-park').addEventListener('click', function () { setDrive(false); });
$('#st-drive').addEventListener('click', function () { setDrive(true); });
$('#st-pill').addEventListener('click', function () { setDrive(!drive); });
renderPill();

/* ---------- settings · Figma "19 · 설정 통합" ---------- */
function bindSwitch(id, key, after) { var b = $('#' + id); b.setAttribute('aria-pressed', String(!!store.data.settings[key])); b.addEventListener('click', function () { store.data.settings[key] = !store.data.settings[key]; b.setAttribute('aria-pressed', String(store.data.settings[key])); store.save(); if (key === 'voice' && !store.data.settings.voice) Mic.stop(); if (after) after(); SFX.tap(); }); if (after) after(); }
function renderMicSetting() {
  var on = !!store.data.settings.voice;
  FUI.setT($('#mic-label'), on ? '마이크 · 켜짐' : '마이크 · 꺼짐');
  FUI.setT($('#mic-desc'), on ? '말로 답하고 “다음” “그만”으로 조작해요.' : '입력창과 화면으로만 답해요.');
  FUI.setT($('#mic-btn-label'), on ? '음성 인식 끄기' : '음성 인식 켜기');
}
bindSwitch('sw-tts', 'tts'); bindSwitch('sw-voice', 'voice', renderMicSetting); bindSwitch('sw-sfx', 'sfx');
/* 음량: 트랙 612px · −/＋ 10% 단위 */
function renderVol() {
  var v = Math.max(0, Math.min(1, store.data.settings.volume)); $('#vol').value = v;
  $('#vol-fill').style.width = (612 * v) + 'px'; $('#vol-knob').style.left = (114 + 612 * v - 15) + 'px';
  FUI.setT($('#vol-label'), Math.round(v * 100) + '%');
}
function setVol(v) { store.data.settings.volume = Math.round(Math.max(0, Math.min(1, v)) * 10) / 10; store.save(); renderVol(); }
$('#vol-minus').addEventListener('click', function () { setVol(store.data.settings.volume - 0.1); SFX.tap(); });
$('#vol-plus').addEventListener('click', function () { setVol(store.data.settings.volume + 0.1); SFX.tap(); });
$('#vol-hit').addEventListener('click', function (e) { var r = this.getBoundingClientRect(); setVol((e.clientX - r.left) / r.width); SFX.tap(); });
$('#vol').addEventListener('input', function () { setVol(+this.value); });
renderVol();
/* 좌석 = 인원 (운전석 · 조수석 · 뒷줄 왼쪽 · 가운데 · 오른쪽 순서로 채운다) */
function renderSeats() {
  var n = store.data.people;
  $$('.seat').forEach(function (s, i) { var on = i < n; s.classList.toggle('is-empty', !on); FUI.setT(FUI.n(s, s.getAttribute('data-sub')), on ? (i === 0 ? '운전 중' : '참여 중') : '＋ 추가'); });
  FUI.setT($('#seat-count'), n + ' / 5석 등록');
  $$('#set-rel .chip').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-r') === store.data.rel)); });
}
$$('.seat').forEach(function (s, i) { s.addEventListener('click', function () { var n = store.data.people; store.data.people = i < n ? Math.max(2, i) : Math.min(5, i + 1); store.save(); renderSeats(); renderHome(); SFX.tap(); }); });
$$('#set-rel .chip').forEach(function (b) { b.addEventListener('click', function () { store.data.rel = b.getAttribute('data-r'); store.save(); renderSeats(); renderHome(); SFX.tap(); }); });
renderSeats();

/* ---------- side menu + home tiles ---------- */
function goNav(nav) {
  if (S && nav !== 'play') { endSession(); if (nav === 'record') return; }
  SFX.tap();
  if (nav === 'home') { renderHome(); show('home'); }
  else if (nav === 'play') { if (!S) openFree(); }
  else if (nav === 'record') show('records');
  else if (nav === 'settings') { renderSeats(); renderVol(); show('settings'); }
}
$$('.nav-item').forEach(function (b) { b.addEventListener('click', function () { goNav(b.getAttribute('data-nav')); }); });
$('#brand-mark').addEventListener('click', function () { $('#brand').click(); });
$('#home-play').addEventListener('click', function () { SFX.ok(); openFree(); });
$('#home-any').addEventListener('click', function () { SFX.ok(); startFree('ANY'); });
$('#home-rec').addEventListener('click', function () { goNav('record'); });
$('#home-post').addEventListener('click', function () { toast('여행 엽서는 준비 중이에요'); });

/* ---------- records · Figma "여행 기록 · 통합" ---------- */
var RATE_LABEL = { 2: '좋았어요', 1: '보통이에요', 0: '별로였어요' };
function gameRow(title, sub) { var r = FUI.clone('gRow'); FUI.setT(FUI.n(r, '여행 밸런스'), title); FUI.setT(FUI.n(r, '10:24 · 5분'), sub); return r; }
function renderRecords() {
  var d = store.data, sl = $('#rec-sessions'), al = $('#rec-album'); sl.innerHTML = ''; al.innerHTML = '';
  var today = new Date().toDateString(), log = d.log.slice().reverse();
  var todays = log.filter(function (e) { return new Date(e.t).toDateString() === today; });
  todays.slice(0, 20).forEach(function (e, i) {
    var t = e.type && e.type !== 'ANY' ? (typeOf(e.type) || {}).name : '자유 · 아무거나';
    var r = gameRow(t, hhmm(e.t) + ' · ' + e.minutes + '분 · 대화 ' + e.answered + '개' + (e.rating != null ? ' · ' + RATE_LABEL[e.rating] : '')); FUI.place(r, 0, i * 154, 768, 130); sl.appendChild(r);
  });
  if (!todays.length) sl.appendChild(h('p', 'sub', '오늘은 아직 기록된 놀이가 없어요.'));
  var days = {}; log.forEach(function (e) { var k = new Date(e.t).toDateString(); if (k === today) return; (days[k] = days[k] || []).push(e); });
  Object.keys(days).slice(0, 20).forEach(function (k, i) {
    var es = days[k], e0 = es[0], dt = new Date(e0.t), dest = e0.dest && REGIONS[e0.dest] ? REGIONS[e0.dest].name + ' 여행' : '여행';
    var r = gameRow(dest, String(dt.getMonth() + 1).padStart(2, '0') + '.' + String(dt.getDate()).padStart(2, '0') + ' · ' + (REL_LABEL[e0.rel] || '') + ' ' + e0.people + '명 · 놀이 ' + es.length + '개'); FUI.place(r, 0, i * 154, 768, 130); al.appendChild(r);
  });
  if (!Object.keys(days).length) al.appendChild(h('p', 'sub', '지난 여행 기록이 아직 없어요.'));
}
$('#log-show').addEventListener('click', function () { var p = $('#log-pre'); p.hidden = !p.hidden; p.textContent = JSON.stringify(store.data.log, null, 1); });
$('#log-clear').addEventListener('click', function () { store.data.log = []; store.data.album = []; store.data.recent = []; store.save(); $('#log-pre').textContent = '[]'; toast('기록을 지웠어요'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && screenName === 'settings') goNav('home'); });


/* ---------- test hooks ---------- */
window.__cpg = { TYPES: TYPES, QUESTIONS: QUESTIONS, GROUPS: GROUPS, poolFor: poolFor, vehicle: Vehicle, parseNum: parseNum, parseCommand: parseCommand, parseUtter: parseUtter, setDrive: setDrive, state: function () { return { S: S, screen: screenName, store: store.data }; } };
$('#free-sub').textContent = TYPES.length + '가지 유형 중 원하는 놀이를 골라요. 끝내고 싶을 때 “그만”이라고 말해요.';
renderHome();
Vehicle.start();
})();

</script>
