<script>
(function () {
  var TOP = 104, BOTTOM = 32;   /* 숨기는 가짜 상단(상태바·주소창)과 하단(홈 표시줄) 높이 */
  var q = new URLSearchParams(location.search);
  var trip = q.get('trip') === 'chuncheon' ? 'chuncheon' : 'gangneung', side = q.get('side') === 'back' ? 'back' : 'front';
  var page = document.getElementById('page'), wrap = document.getElementById('wrap'), toastEl = document.getElementById('toast'), th;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(th); th = setTimeout(function () { toastEl.classList.remove('show'); }, 2200); }
  function norm(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }
  function fit() {
    var w = Math.min(window.innerWidth, 560), s = w / 398, h = 852 - TOP - BOTTOM;
    page.style.transform = 'scale(' + s + ') translateY(' + (-TOP) + 'px)';
    wrap.style.width = w + 'px'; wrap.style.height = Math.ceil(h * s) + 'px';
  }
  function byText(t) { return Array.prototype.filter.call(page.querySelectorAll('.f-t'), function (e) { return norm(e.textContent) === t; })[0]; }
  function button(t) { var e = byText(t); if (!e) return null; var b = e.parentElement; while (b && b !== page && !/background|box-shadow/.test(b.getAttribute('style') || '')) b = b.parentElement; return b && b !== page ? b : e; }
  function on(t, fn) { var b = button(t); if (!b) return; b.classList.add('hot'); b.setAttribute('role', 'button'); b.addEventListener('click', fn); }
  function img(s) { return 'postcards/' + trip + '-' + s + '.png'; }
  function fileOf(s) { return fetch(img(s)).then(function (r) { return r.blob(); }).then(function (b) { return new File([b], 'talkrider-' + trip + '-' + s + '.png', { type: 'image/png' }); }); }
  function download(file) { var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  function show(s) {
    side = s; page.innerHTML = document.getElementById('tpl-' + trip + '-' + side).innerHTML;
    history.replaceState(null, '', '?trip=' + trip + '&side=' + side);
    on('앞면', function () { show('front'); }); on('뒷면', function () { show('back'); });
    on('뒷면 보기', function () { show('back'); }); on('앞면 보기', function () { show('front'); });
    /* 이미지 저장: 공유 시트(사진에 저장) → 안 되면 파일로 내려받기 */
    on('이미지 저장', function () {
      fileOf(side).then(function (f) {
        if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f], title: '여행 엽서' }).then(function () { toast('엽서를 저장했어요'); });
        download(f); toast('엽서 이미지를 내려받았어요');
      }).catch(function (e) { if (e && e.name === 'AbortError') return; toast('저장하지 못했어요 · 엽서를 길게 눌러 저장하세요'); });
    });
    on('공유하기', function () {
      var url = location.href;
      if (navigator.share) navigator.share({ title: '토크라이더 여행 엽서', url: url }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('링크를 복사했어요'); });
    });
  }
  window.addEventListener('resize', fit); fit(); show(side);
})();
</script>
